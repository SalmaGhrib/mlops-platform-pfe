spring.application.name=mlops-backend

server.port=8081

# ===============================
# MySQL database
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-service:3306/mlops_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HikariCP - stable pour MySQL local
# ===============================
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=120000

# ===============================
# Scheduling
# Un seul thread pour éviter plusieurs sync DB en parallèle
# ===============================
spring.task.scheduling.pool.size=1

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Important :
# true = plus sûr pour ton code actuel avec relations lazy
# si plus tard tout est bien DTO, tu peux mettre false
spring.jpa.open-in-view=true

# ===============================
# Mail verification - Gmail SMTP
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ===============================
# Upload files - scalable shared PVC
# ===============================
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}
app.uploads.pvc-enabled=${APP_UPLOADS_PVC_ENABLED:true}
app.uploads.pvc-name=${APP_UPLOADS_PVC_NAME:mlops-uploads-pvc}
app.uploads.mount-path=${APP_UPLOADS_MOUNT_PATH:/app/uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=1GB
server.connection-timeout=600s


# ===============================
# STANDARD_RUNTIME
# ===============================
app.pipeline.gateway-url=${APP_PIPELINE_GATEWAY_URL:http://pipeline-gateway-service.mlops.svc.cluster.local:8001/upload-and-run-custom-model}
app.runtime.analysis-api-url=${APP_RUNTIME_ANALYSIS_API_URL:http://pipeline-gateway-service.mlops.svc.cluster.local:8001/api/runtime/analyze-script}

# ===============================
# MLflow
# ===============================
app.mlflow.tracking-url=${APP_MLFLOW_TRACKING_URL:http://mlflow-service.mlops.svc.cluster.local:5000}
app.mlflow.tracking-uri=${APP_MLFLOW_TRACKING_URI:http://mlflow-service.mlops.svc.cluster.local:5000}
app.mlflow.production-alias=production

# URI MLflow utilisée par Spring Boot pour appeler l'API REST MLflow localement
mlflow.tracking.uri=${MLFLOW_TRACKING_URI:http://mlflow-service.mlops.svc.cluster.local:5000}

# ===============================
# Prediction API
# ===============================
custom.predict.api.url=${CUSTOM_PREDICT_API_URL:http://pipeline-gateway-service.mlops.svc.cluster.local:8001}

# ===============================
# Kubeflow pipeline file
# ===============================
app.kubeflow.pipeline-file=${APP_KUBEFLOW_PIPELINE_FILE:/app/mini-mlops/kubeflow/compiled/custom_model_pipeline.yaml}

# ===============================
# Kubernetes
# ===============================
app.kubernetes.namespace=mlops
app.kubernetes.custom-job.service-account=default
app.kubernetes.custom-job.ttl-seconds=3600
app.kubernetes.custom-job.backoff-limit=0

# ===============================
# CUSTOM_DOCKERFILE automation
# Ralenti pour éviter la concurrence avec auto-sync et deployment reconciler
# ===============================
app.custom-docker.watcher.enabled=true
app.custom-docker.watcher.delay-ms=${APP_CUSTOM_DOCKER_WATCHER_DELAY_MS:30000}

# ===============================
# Docker Hub Registry
# ===============================
app.docker.registry=${APP_DOCKER_REGISTRY:acrmlopssalmav2.azurecr.io}
app.docker.custom-image-prefix=${APP_DOCKER_CUSTOM_IMAGE_PREFIX:mlops-custom}
app.docker.image-pull-secret=${APP_DOCKER_IMAGE_PULL_SECRET:}

# ===============================
# Kaniko build
# ===============================
app.kaniko.image=gcr.io/kaniko-project/executor:latest
app.kaniko.docker-config-secret=${APP_KANIKO_DOCKER_CONFIG_SECRET:kaniko-docker-config}
app.kaniko.cache-repo=${APP_KANIKO_CACHE_REPO:acrmlopssalma.azurecr.io/mlops-kaniko-cache}

# Path to the corrected platform_runner.py used to inject into custom image build contexts
# Can be overridden via environment variable APP_PLATFORM_RUNNER_PATH
app.platform-runner.path=${APP_PLATFORM_RUNNER_PATH:/app/mini-mlops/src/custom_models/platform_runner.py}

# Root of the platform runtime files to copy into custom image build contexts
app.platform-runtime-root=${APP_PLATFORM_RUNTIME_ROOT:/app/mini-mlops}

# ===============================
# Automatic MLOps synchronization
# Avant : 60000 ms
# Maintenant : 180000 ms pour éviter les sync trop fréquentes
# ===============================
app.mlops.auto-sync.enabled=true
app.mlops.auto-sync.delay-ms=${APP_MLOPS_AUTO_SYNC_DELAY_MS:300000}

# ===============================
# Kubernetes service readiness check
# ===============================
app.kubernetes.service-health-path=/health
app.kubernetes.service-health-timeout-ms=2000

# ===============================
# Image Docker générique pour STANDARD_RUNTIME
# ===============================
app.deployment.default-docker-image=${APP_DEPLOYMENT_DEFAULT_DOCKER_IMAGE:acrmlopssalma.azurecr.io/mlops-generic-model-server:v6}

# ===============================
# Dedicated serving image builder
# ===============================
app.serving.dedicated-image.enabled=true
app.serving.template-dir=${APP_SERVING_TEMPLATE_DIR:/app/mini-mlops/serving-template}
app.serving.build-dir=${APP_SERVING_BUILD_DIR:/tmp/mlops/generated-serving-images}
app.serving.local-docker-build.enabled=${APP_SERVING_LOCAL_DOCKER_BUILD_ENABLED:false}
app.serving.reuse-image-if-same-requirements=true

# Fix conflit mlflow 2.x / pyarrow
app.serving.compatible-pyarrow-version=17.0.0

# ===============================
# Auto deployment
# ===============================
app.mlops.auto-deploy.enabled=true

# ===============================
# Production deployment reconciler
# Toutes les 10 secondes pour synchroniser rapidement DEPLOYING/OUT_OF_SYNC rows
# avec l'état réel de Kubernetes.
# ===============================
app.mlops.production-reconciler.enabled=true
app.mlops.production-reconciler.delay-ms=${APP_MLOPS_PRODUCTION_RECONCILER_DELAY_MS:60000}
app.mlops.production-reconciler.initial-delay-ms=${APP_MLOPS_PRODUCTION_RECONCILER_INITIAL_DELAY_MS:30000}

# ===============================
# Deployment cleanup automation
# Désactivé en local pour éviter la concurrence avec les sync/deployments
# À réactiver plus tard en production ou sur Azure
# ===============================
app.mlops.deployment-cleanup.enabled=false
app.mlops.deployment-cleanup.delay-ms=600000
app.mlops.deployment-cleanup.initial-delay-ms=300000
app.mlops.deployment-cleanup.keep-history=true
app.mlops.deployment-cleanup.delete-failed-after-hours=1

# ===============================
# Model artifact standardizer
# ===============================
app.model-standardizer.enabled=true
app.model-standardizer.python-command=python
app.model-standardizer.script-path=${APP_MODEL_STANDARDIZER_SCRIPT_PATH:/app/scripts/standardize_model_artifact.py}
app.model-standardizer.target-artifact-path=standardized_model

# ===============================
# Prometheus + Grafana
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=mlops-backend
monitoring.prometheus.url=${MONITORING_PROMETHEUS_URL:http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090}

# ===============================
# Logs - version stable, sans doublons
# ===============================
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=ERROR
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN

# Ton package principal
logging.level.com.mlops.platform=INFO

# Services très bavards
logging.level.com.mlops.platform.service.KubernetesModelServingService=WARN
logging.level.com.mlops.platform.service.ModelDeploymentService=WARN
logging.level.com.mlops.platform.service.ModelServingImageBuildService=WARN
logging.level.com.mlops.platform.service.MlExperimentService=WARN
logging.level.com.mlops.platform.service.MlflowTrackingClientService=WARN
logging.level.com.mlops.platform.service.AutoModelLifecycleService=WARN
logging.level.com.mlops.platform.service.CustomDockerRunWatcherService=WARN
logging.level.com.mlops.platform.service.ProductionDeploymentReconcilerService=WARN

monitoring.alert.failed-runs-threshold=1
monitoring.alert.failed-deployments-threshold=1
monitoring.alert.unavailable-models-threshold=1
monitoring.alert.backend-latency-ms-threshold=1000

monitoring.alert.failed-runs-by-project-threshold=1
monitoring.alert.failed-runs-lookback-hours=9999
monitoring.retraining.cooldown-minutes=0


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=1GB
server.connection-timeout=600s
# ===============================
# Scheduler guards - avoids noisy loops when features are not configured
# ===============================
app.retraining.scheduler.enabled=true
app.retraining.scheduler.delay-ms=30000
app.monitoring.alerts.enabled=false
app.monitoring.alerts.delay-ms=60000

# Notifications: only recent events are returned; cleanup is periodic.
app.notifications.cleanup.delay-ms=900000
app.notifications.cleanup.initial-delay-ms=15000

# Automatic retraining scheduler (safe with HPA/ShedLock).
app.retraining.scheduler.delay-ms=60000
app.retraining.scheduler.initial-delay-ms=30000
app.retraining.scheduler.stuck-timeout-minutes=30

# Stable scheduler configuration
spring.task.scheduling.pool.size=8
app.custom-docker.watcher.enabled=true
app.custom-docker.watcher.delay-ms=10000
app.custom-docker.watcher.initial-delay-ms=10000
app.mlops.auto-sync.enabled=true
app.mlops.auto-sync.delay-ms=60000
app.mlops.auto-sync.initial-delay-ms=30000
app.retraining.scheduler.enabled=true
app.retraining.scheduler.delay-ms=60000
app.retraining.scheduler.initial-delay-ms=30000

# Public frontend URL used in verification/reset emails
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:4200}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
