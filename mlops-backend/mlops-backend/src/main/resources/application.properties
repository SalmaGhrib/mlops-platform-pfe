spring.application.name=mlops-backend

server.port=8081

# ===============================
# MySQL database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/mlops_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HikariCP - stable pour MySQL local
# ===============================
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=120000

# ===============================
# Scheduling
# Un seul thread pour éviter plusieurs sync DB en parallèle
# ===============================
spring.task.scheduling.pool.size=1

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Important :
# true = plus sûr pour ton code actuel avec relations lazy
# si plus tard tout est bien DTO, tu peux mettre false
spring.jpa.open-in-view=true

# ===============================
# Mail verification - Gmail SMTP
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=ghribsalma175@gmail.com
spring.mail.password=REMETS_TON_MOT_DE_PASSE_ICI
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# Upload files
# ===============================
app.upload.dir=uploads

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ===============================
# STANDARD_RUNTIME
# ===============================
app.pipeline.gateway-url=http://127.0.0.1:8001/upload-and-run-custom-model
app.runtime.analysis-api-url=http://127.0.0.1:8001/api/runtime/analyze-script

# ===============================
# MLflow
# ===============================
app.mlflow.tracking-url=http://127.0.0.1:5000
app.mlflow.tracking-uri=http://mlflow-service.mlops.svc.cluster.local:5000
app.mlflow.production-alias=production

# URI MLflow utilisée par Spring Boot pour appeler l'API REST MLflow localement
mlflow.tracking.uri=http://127.0.0.1:5000

# ===============================
# Prediction API
# ===============================
custom.predict.api.url=http://localhost:8000

# ===============================
# Kubeflow pipeline file
# ===============================
app.kubeflow.pipeline-file=C:/Users/ASUS/OneDrive - ESPRIT/Bureau/Pfe/cours esprit/mini-mlops/kubeflow/compiled/custom_model_pipeline.yaml

# ===============================
# Kubernetes
# ===============================
app.kubernetes.namespace=mlops
app.kubernetes.custom-job.service-account=default
app.kubernetes.custom-job.ttl-seconds=3600
app.kubernetes.custom-job.backoff-limit=0

# ===============================
# CUSTOM_DOCKERFILE automation
# Ralenti pour éviter la concurrence avec auto-sync et deployment reconciler
# ===============================
app.custom-docker.watcher.enabled=true
app.custom-docker.watcher.delay-ms=180000

# ===============================
# Docker Hub Registry
# ===============================
app.docker.registry=docker.io/salmaghrib2003
app.docker.custom-image-prefix=mlops-custom
app.docker.image-pull-secret=dockerhub-secret

# ===============================
# Kaniko build
# ===============================
app.kaniko.image=gcr.io/kaniko-project/executor:latest
app.kaniko.docker-config-secret=kaniko-docker-config

# ===============================
# Automatic MLOps synchronization
# Avant : 60000 ms
# Maintenant : 180000 ms pour éviter les sync trop fréquentes
# ===============================
app.mlops.auto-sync.enabled=true
app.mlops.auto-sync.delay-ms=180000

# ===============================
# Kubernetes service readiness check
# ===============================
app.kubernetes.service-health-path=/health
app.kubernetes.service-health-timeout-ms=2000

# ===============================
# Image Docker générique pour STANDARD_RUNTIME
# ===============================
app.deployment.default-docker-image=docker.io/salmaghrib2003/mlops-generic-model-server:v6

# ===============================
# Dedicated serving image builder
# ===============================
app.serving.dedicated-image.enabled=true
app.serving.template-dir=C:/Users/ASUS/OneDrive - ESPRIT/Bureau/Pfe/cours esprit/mini-mlops/serving-template
app.serving.build-dir=C:/Users/ASUS/OneDrive - ESPRIT/Bureau/Pfe/cours esprit/mini-mlops/generated-serving-images
app.serving.local-docker-build.enabled=true
app.serving.reuse-image-if-same-requirements=true

# Fix conflit mlflow 2.x / pyarrow
app.serving.compatible-pyarrow-version=17.0.0

# ===============================
# Auto deployment
# ===============================
app.mlops.auto-deploy.enabled=true

# ===============================
# Production deployment reconciler
# Avant : toutes les 30s
# Maintenant : toutes les 3 min pour ne pas saturer MySQL
# ===============================
app.mlops.production-reconciler.enabled=true
app.mlops.production-reconciler.delay-ms=180000
app.mlops.production-reconciler.initial-delay-ms=90000

# ===============================
# Deployment cleanup automation
# Désactivé en local pour éviter la concurrence avec les sync/deployments
# À réactiver plus tard en production ou sur Azure
# ===============================
app.mlops.deployment-cleanup.enabled=false
app.mlops.deployment-cleanup.delay-ms=600000
app.mlops.deployment-cleanup.initial-delay-ms=300000
app.mlops.deployment-cleanup.keep-history=true
app.mlops.deployment-cleanup.delete-failed-after-hours=1

# ===============================
# Model artifact standardizer
# ===============================
app.model-standardizer.enabled=true
app.model-standardizer.python-command=python
app.model-standardizer.script-path=C:/Users/ASUS/OneDrive - ESPRIT/Bureau/mlops-backend/scripts/standardize_model_artifact.py
app.model-standardizer.target-artifact-path=standardized_model

# ===============================
# Prometheus + Grafana
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=mlops-backend
monitoring.prometheus.url=http://localhost:9090

# ===============================
# Logs - version stable, sans doublons
# ===============================
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=ERROR
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN

# Ton package principal
logging.level.com.mlops.platform=INFO

# Services très bavards
logging.level.com.mlops.platform.service.KubernetesModelServingService=WARN
logging.level.com.mlops.platform.service.ModelDeploymentService=WARN
logging.level.com.mlops.platform.service.ModelServingImageBuildService=WARN
logging.level.com.mlops.platform.service.MlExperimentService=WARN
logging.level.com.mlops.platform.service.MlflowTrackingClientService=WARN
logging.level.com.mlops.platform.service.AutoModelLifecycleService=WARN
logging.level.com.mlops.platform.service.CustomDockerRunWatcherService=WARN
logging.level.com.mlops.platform.service.ProductionDeploymentReconcilerService=WARN

monitoring.alert.failed-runs-threshold=1
monitoring.alert.failed-deployments-threshold=1
monitoring.alert.unavailable-models-threshold=1
monitoring.alert.backend-latency-ms-threshold=1000

monitoring.alert.failed-runs-by-project-threshold=1
monitoring.alert.failed-runs-lookback-hours=9999
monitoring.retraining.cooldown-minutes=0