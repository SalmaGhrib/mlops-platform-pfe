# =========================================================
# APPLICATION
# =========================================================

spring.application.name=mlops-backend
server.port=8081


# =========================================================
# DATABASE — MYSQL
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-service.mlops.svc.cluster.local:3306/mlops_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# HIKARICP
# =========================================================


spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.open-in-view=true

# =========================================================
# SCHEDULING
# =========================================================

# Plusieurs schedulers fonctionnent simultanément :
# - monitoring intelligent
# - réentraînement automatique
# - watcher Docker personnalisé
# - synchronisation MLflow
# - réparation de source
# - réconciliation des déploiements
spring.task.scheduling.pool.size=8


# =========================================================
# EMAIL — GMAIL SMTP
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp

spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# FRONTEND / CORS
# =========================================================

app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://128.251.112.197}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://128.251.112.197,http://localhost:4200,http://127.0.0.1:4200}


# =========================================================
# UPLOADS
# =========================================================

app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}

app.uploads.pvc-enabled=${APP_UPLOADS_PVC_ENABLED:true}
app.uploads.pvc-name=${APP_UPLOADS_PVC_NAME:backend-uploads-pvc}
app.uploads.mount-path=${APP_UPLOADS_MOUNT_PATH:/app/uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=1GB
server.connection-timeout=600s


# =========================================================
# PIPELINE GATEWAY — STANDARD_RUNTIME
# =========================================================

app.pipeline.gateway-url=${APP_PIPELINE_GATEWAY_URL:http://pipeline-gateway-service.mlops.svc.cluster.local:8001/upload-and-run-custom-model}

app.runtime.analysis-api-url=${APP_RUNTIME_ANALYSIS_API_URL:http://pipeline-gateway-service.mlops.svc.cluster.local:8001/api/runtime/analyze-script}


# =========================================================
# MLFLOW
# =========================================================

app.mlflow.tracking-url=${APP_MLFLOW_TRACKING_URL:http://mlflow-service.mlops.svc.cluster.local:5000}

app.mlflow.tracking-uri=${APP_MLFLOW_TRACKING_URI:http://mlflow-service.mlops.svc.cluster.local:5000}

mlflow.tracking.uri=${MLFLOW_TRACKING_URI:http://mlflow-service.mlops.svc.cluster.local:5000}

app.mlflow.production-alias=${APP_MLFLOW_PRODUCTION_ALIAS:production}


# =========================================================
# PREDICTION API
# =========================================================

custom.predict.api.url=${CUSTOM_PREDICT_API_URL:http://pipeline-gateway-service.mlops.svc.cluster.local:8001}


# =========================================================
# KUBEFLOW
# =========================================================

app.kubeflow.pipeline-file=${APP_KUBEFLOW_PIPELINE_FILE:/app/mini-mlops/kubeflow/compiled/custom_model_pipeline.yaml}


# =========================================================
# KUBERNETES
# =========================================================

app.kubernetes.namespace=${APP_KUBERNETES_NAMESPACE:mlops}

app.kubernetes.custom-job.service-account=${APP_KUBERNETES_CUSTOM_JOB_SERVICE_ACCOUNT:default}

app.kubernetes.custom-job.ttl-seconds=${APP_KUBERNETES_CUSTOM_JOB_TTL_SECONDS:3600}

app.kubernetes.custom-job.backoff-limit=${APP_KUBERNETES_CUSTOM_JOB_BACKOFF_LIMIT:0}

app.kubernetes.service-health-path=${APP_KUBERNETES_SERVICE_HEALTH_PATH:/health}

app.kubernetes.service-health-timeout-ms=${APP_KUBERNETES_SERVICE_HEALTH_TIMEOUT_MS:2000}


# =========================================================
# CUSTOM_DOCKERFILE WATCHER
# =========================================================

app.custom-docker.watcher.enabled=${APP_CUSTOM_DOCKER_WATCHER_ENABLED:true}

app.custom-docker.watcher.initial-delay-ms=${APP_CUSTOM_DOCKER_WATCHER_INITIAL_DELAY_MS:10000}

app.custom-docker.watcher.delay-ms=${APP_CUSTOM_DOCKER_WATCHER_DELAY_MS:10000}


# =========================================================
# AZURE CONTAINER REGISTRY
# =========================================================

app.docker.registry=${APP_DOCKER_REGISTRY:acrmlopssalmav2.azurecr.io}

app.docker.custom-image-prefix=${APP_DOCKER_CUSTOM_IMAGE_PREFIX:mlops-custom}

app.docker.image-pull-secret=${APP_DOCKER_IMAGE_PULL_SECRET:}


# =========================================================
# KANIKO
# =========================================================

app.kaniko.image=${APP_KANIKO_IMAGE:gcr.io/kaniko-project/executor:latest}

app.kaniko.docker-config-secret=${APP_KANIKO_DOCKER_CONFIG_SECRET:kaniko-docker-config}

app.kaniko.cache-repo=${APP_KANIKO_CACHE_REPO:acrmlopssalmav2.azurecr.io/mlops-kaniko-cache}


# =========================================================
# PLATFORM RUNTIME
# =========================================================

app.platform-runner.path=${APP_PLATFORM_RUNNER_PATH:/app/mini-mlops/src/custom_models/platform_runner.py}

app.platform-runtime-root=${APP_PLATFORM_RUNTIME_ROOT:/app/mini-mlops}


# =========================================================
# AUTOMATIC MLOPS SYNCHRONIZATION
# =========================================================

app.mlops.auto-sync.enabled=${APP_MLOPS_AUTO_SYNC_ENABLED:true}

app.mlops.auto-sync.initial-delay-ms=${APP_MLOPS_AUTO_SYNC_INITIAL_DELAY_MS:30000}

app.mlops.auto-sync.delay-ms=${APP_MLOPS_AUTO_SYNC_DELAY_MS:60000}


# =========================================================
# GENERIC MODEL SERVING IMAGE
# =========================================================

app.deployment.default-docker-image=${APP_DEPLOYMENT_DEFAULT_DOCKER_IMAGE:acrmlopssalmav2.azurecr.io/mlops-generic-model-server:v6}


# =========================================================
# DEDICATED SERVING IMAGE BUILDER
# =========================================================

app.serving.dedicated-image.enabled=${APP_SERVING_DEDICATED_IMAGE_ENABLED:true}

app.serving.template-dir=${APP_SERVING_TEMPLATE_DIR:/app/mini-mlops/serving-template}

app.serving.build-dir=${APP_SERVING_BUILD_DIR:/tmp/mlops/generated-serving-images}

app.serving.local-docker-build.enabled=${APP_SERVING_LOCAL_DOCKER_BUILD_ENABLED:false}

app.serving.reuse-image-if-same-requirements=${APP_SERVING_REUSE_IMAGE_IF_SAME_REQUIREMENTS:true}

app.serving.compatible-pyarrow-version=${APP_SERVING_COMPATIBLE_PYARROW_VERSION:17.0.0}


# =========================================================
# MODEL STANDARDIZER
# =========================================================

app.model-standardizer.enabled=${APP_MODEL_STANDARDIZER_ENABLED:true}

app.model-standardizer.python-command=${APP_MODEL_STANDARDIZER_PYTHON_COMMAND:python}

app.model-standardizer.script-path=${APP_MODEL_STANDARDIZER_SCRIPT_PATH:/app/scripts/standardize_model_artifact.py}

app.model-standardizer.target-artifact-path=${APP_MODEL_STANDARDIZER_TARGET_ARTIFACT_PATH:standardized_model}


# =========================================================
# AUTOMATIC DEPLOYMENT
# =========================================================

app.mlops.auto-deploy.enabled=${APP_MLOPS_AUTO_DEPLOY_ENABLED:true}


# =========================================================
# PRODUCTION DEPLOYMENT RECONCILER
# =========================================================

app.mlops.production-reconciler.enabled=${APP_MLOPS_PRODUCTION_RECONCILER_ENABLED:true}

app.mlops.production-reconciler.initial-delay-ms=${APP_MLOPS_PRODUCTION_RECONCILER_INITIAL_DELAY_MS:30000}

app.mlops.production-reconciler.delay-ms=${APP_MLOPS_PRODUCTION_RECONCILER_DELAY_MS:60000}


# =========================================================
# DEPLOYMENT CLEANUP
# =========================================================

app.mlops.deployment-cleanup.enabled=${APP_MLOPS_DEPLOYMENT_CLEANUP_ENABLED:false}

app.mlops.deployment-cleanup.initial-delay-ms=${APP_MLOPS_DEPLOYMENT_CLEANUP_INITIAL_DELAY_MS:300000}

app.mlops.deployment-cleanup.delay-ms=${APP_MLOPS_DEPLOYMENT_CLEANUP_DELAY_MS:600000}

app.mlops.deployment-cleanup.keep-history=${APP_MLOPS_DEPLOYMENT_CLEANUP_KEEP_HISTORY:true}

app.mlops.deployment-cleanup.delete-failed-after-hours=${APP_MLOPS_DEPLOYMENT_CLEANUP_DELETE_FAILED_AFTER_HOURS:1}


# =========================================================
# AUTOMATIC RETRAINING SCHEDULER
# =========================================================

app.retraining.scheduler.enabled=${APP_RETRAINING_SCHEDULER_ENABLED:true}

app.retraining.scheduler.initial-delay-ms=${APP_RETRAINING_SCHEDULER_INITIAL_DELAY_MS:30000}

app.retraining.scheduler.delay-ms=${APP_RETRAINING_SCHEDULER_DELAY_MS:30000}

app.retraining.scheduler.stuck-timeout-minutes=${APP_RETRAINING_SCHEDULER_STUCK_TIMEOUT_MINUTES:30}


# =========================================================
# INTELLIGENT MONITORING SCHEDULER
# =========================================================

# IMPORTANT :
# doit rester true pour permettre à SMART_MONITORING_ONLY
# et FULL_SMART de détecter les signaux.
app.monitoring.alerts.enabled=${APP_MONITORING_ALERTS_ENABLED:true}

app.monitoring.alerts.initial-delay-ms=${APP_MONITORING_ALERTS_INITIAL_DELAY_MS:20000}

app.monitoring.alerts.delay-ms=${APP_MONITORING_ALERTS_DELAY_MS:30000}


# =========================================================
# MONITORING THRESHOLDS
# =========================================================

monitoring.alert.failed-runs-threshold=${MONITORING_ALERT_FAILED_RUNS_THRESHOLD:1}

monitoring.alert.failed-deployments-threshold=${MONITORING_ALERT_FAILED_DEPLOYMENTS_THRESHOLD:1}

monitoring.alert.unavailable-models-threshold=${MONITORING_ALERT_UNAVAILABLE_MODELS_THRESHOLD:1}

monitoring.alert.backend-latency-ms-threshold=${MONITORING_ALERT_BACKEND_LATENCY_MS_THRESHOLD:1000}


# =========================================================
# FAILED RUNS — PROJECT MONITORING
# =========================================================

monitoring.alert.failed-runs-by-project-threshold=${MONITORING_ALERT_FAILED_RUNS_BY_PROJECT_THRESHOLD:1}

# Valeur de test :
# détecte les runs échoués pendant les dernières 24 heures.
monitoring.alert.failed-runs-lookback-hours=${MONITORING_ALERT_FAILED_RUNS_LOOKBACK_HOURS:24}


# =========================================================
# SMART RETRAINING
# =========================================================

# Pendant les tests, 0 permet un nouveau déclenchement sans cooldown.
# En production, mettre par exemple 60 ou 120.
monitoring.retraining.cooldown-minutes=${MONITORING_RETRAINING_COOLDOWN_MINUTES:60}


# =========================================================
# PROMETHEUS / ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,prometheus,metrics

management.endpoint.health.show-details=always

management.endpoint.prometheus.access=unrestricted

management.prometheus.metrics.export.enabled=true

management.metrics.tags.application=mlops-backend

monitoring.prometheus.url=${MONITORING_PROMETHEUS_URL:http://prometheus-k8s.monitoring.svc.cluster.local:9090}


# =========================================================
# NOTIFICATIONS CLEANUP
# =========================================================

app.notifications.cleanup.initial-delay-ms=${APP_NOTIFICATIONS_CLEANUP_INITIAL_DELAY_MS:15000}

app.notifications.cleanup.delay-ms=${APP_NOTIFICATIONS_CLEANUP_DELAY_MS:900000}


# =========================================================
# LOGGING
# =========================================================

logging.level.root=WARN

logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=ERROR

logging.level.com.zaxxer.hikari=WARN

logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN

# Logs de la plateforme
logging.level.com.mlops.platform=INFO

# Schedulers importants
logging.level.com.mlops.platform.scheduler.MonitoringAlertScheduler=INFO
logging.level.com.mlops.platform.scheduler.AutoRetrainingScheduler=INFO

# Services de monitoring et réentraînement
logging.level.com.mlops.platform.service.MonitoringRetrainingTriggerService=INFO
logging.level.com.mlops.platform.service.AutoRetrainingService=INFO
logging.level.com.mlops.platform.service.RetrainingDecisionService=INFO
logging.level.com.mlops.platform.service.RetrainingSourceResolverService=INFO

# Services très verbeux
logging.level.com.mlops.platform.service.KubernetesModelServingService=WARN
logging.level.com.mlops.platform.service.ModelDeploymentService=WARN
logging.level.com.mlops.platform.service.ModelServingImageBuildService=WARN
logging.level.com.mlops.platform.service.MlExperimentService=WARN
logging.level.com.mlops.platform.service.MlflowTrackingClientService=WARN
logging.level.com.mlops.platform.service.AutoModelLifecycleService=WARN
logging.level.com.mlops.platform.service.ProductionDeploymentReconcilerService=WARN