name: CI/CD - ACR and AKS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: acrmlopssalmav2
  ACR_LOGIN_SERVER: acrmlopssalmav2.azurecr.io

  RESOURCE_GROUP: RG-SalmaGhrib-V2
  AKS_CLUSTER: aks-mlops-salma-v2
  NAMESPACE: mlops

  BACKEND_IMAGE: mlops-backend
  FRONTEND_IMAGE: mlops-frontend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # CHECKOUT
      # ==============================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ==============================
      # AZURE LOGIN - OIDC
      # ==============================
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ==============================
      # LOGIN TO ACR
      # ==============================
      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      # ==============================
      # BACKEND SPRING BOOT
      # ==============================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Maven wrapper executable
        run: chmod +x ./mlops-backend/mlops-backend/mvnw

      - name: Build backend JAR
        run: |
          ./mlops-backend/mlops-backend/mvnw \
            -f ./mlops-backend/mlops-backend/pom.xml \
            clean package -DskipTests

      - name: Verify backend build context
        run: |
          echo "Checking backend JAR..."
          ls -la ./mlops-backend/mlops-backend/target

          echo "Checking mini-mlops..."
          test -f ./mini-mlops/src/custom_models/platform_runner.py

      # ==============================
      # BACKEND DOCKER -> ACR
      # ==============================
      - name: Build backend Docker image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$BACKEND_IMAGE:${{ github.sha }} \
            -t $ACR_LOGIN_SERVER/$BACKEND_IMAGE:latest \
            -f ./mlops-backend/mlops-backend/Dockerfile .

      - name: Push backend image to ACR
        run: |
          docker push $ACR_LOGIN_SERVER/$BACKEND_IMAGE:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/$BACKEND_IMAGE:latest

      # ==============================
      # FRONTEND ANGULAR
      # ==============================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/free-angular-tailwind-dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: front-end/free-angular-tailwind-dashboard
        run: npm ci

      - name: Build frontend
        working-directory: front-end/free-angular-tailwind-dashboard
        run: npm run build

      # ==============================
      # FRONTEND DOCKER -> ACR
      # ==============================
      - name: Build frontend Docker image
        working-directory: front-end/free-angular-tailwind-dashboard
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$FRONTEND_IMAGE:${{ github.sha }} \
            -t $ACR_LOGIN_SERVER/$FRONTEND_IMAGE:latest \
            .

      - name: Push frontend image to ACR
        run: |
          docker push $ACR_LOGIN_SERVER/$FRONTEND_IMAGE:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/$FRONTEND_IMAGE:latest

      # ==============================
      # CONNECT TO AKS
      # ==============================
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $RESOURCE_GROUP \
            --name $AKS_CLUSTER \
            --overwrite-existing

      # ==============================
      # CD - DEPLOY BACKEND
      # ==============================
      - name: Deploy backend to AKS
        run: |
          kubectl set image deployment/mlops-backend \
            mlops-backend=$ACR_LOGIN_SERVER/$BACKEND_IMAGE:${{ github.sha }} \
            -n $NAMESPACE

      # ==============================
      # CD - DEPLOY FRONTEND
      # ==============================
      - name: Deploy frontend to AKS
        run: |
          kubectl set image deployment/mlops-frontend \
            mlops-frontend=$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:${{ github.sha }} \
            -n $NAMESPACE

      # ==============================
      # VERIFY ROLLOUT
      # ==============================
      - name: Verify backend rollout
        run: |
          kubectl rollout status deployment/mlops-backend \
            -n $NAMESPACE \
            --timeout=10m

      - name: Verify frontend rollout
        run: |
          kubectl rollout status deployment/mlops-frontend \
            -n $NAMESPACE \
            --timeout=10m

      # ==============================
      # FINAL STATUS
      # ==============================
      - name: Show deployment status
        run: |
          kubectl get deployments -n $NAMESPACE
          kubectl get pods -n $NAMESPACE