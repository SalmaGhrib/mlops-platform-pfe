name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ==============================
      # CHECKOUT
      # ==============================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ==============================
      # DOCKER HUB LOGIN
      # ==============================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==============================
      # BACKEND SPRING BOOT
      # ==============================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Maven wrapper executable
        run: chmod +x ./mlops-backend/mlops-backend/mvnw

      - name: Build backend JAR
        run: ./mlops-backend/mlops-backend/mvnw -f ./mlops-backend/mlops-backend/pom.xml clean package -DskipTests

      - name: Verify backend build context
        run: |
          echo "Checking backend jar..."
          ls -la ./mlops-backend/mlops-backend/target

          echo "Checking mini-mlops exists at repo root..."
          ls -la ./mini-mlops

          echo "Checking platform_runner.py..."
          test -f ./mini-mlops/src/custom_models/platform_runner.py

      - name: Build backend Docker image
        run: |
          docker build --pull \
            -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:latest \
            -f ./mlops-backend/mlops-backend/Dockerfile .

      - name: Push backend Docker image
        run: docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:latest

      # ==============================
      # FRONTEND ANGULAR
      # ==============================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: front-end/free-angular-tailwind-dashboard
        run: npm ci

      - name: Build frontend
        working-directory: front-end/free-angular-tailwind-dashboard
        run: npm run build

      - name: Build frontend Docker image
        working-directory: front-end/free-angular-tailwind-dashboard
        run: docker build --pull -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-frontend:latest .

      - name: Push frontend Docker image
        run: docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-frontend:latest