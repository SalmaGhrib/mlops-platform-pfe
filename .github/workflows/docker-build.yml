# Nom du workflow affiché dans l’onglet Actions de GitHub
name: Build and Push Docker Images

# Déclenchement du pipeline
# Ici : le workflow se lance automatiquement à chaque git push sur la branche main
on:
  push:
    branches:
      - main

jobs:
  # Nom du job principal
  build-and-push:
    # GitHub va créer une machine virtuelle Linux temporaire pour exécuter le pipeline
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : récupérer le code source du repository GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # Étape 2 : connexion à Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==============================
      # BACKEND SPRING BOOT
      # ==============================

      # Étape 3 : installer Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Étape 4 : compiler le backend Spring Boot
      - name: Build backend JAR
        working-directory: mlops-backend/mlops-backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # Étape 5 : copier mini-mlops dans le contexte Docker du backend
      #
      # Important :
      # Le docker build backend s’exécute dans mlops-backend/mlops-backend.
      # Donc Docker ne voit pas le dossier mini-mlops à la racine du repo.
      # On le copie ici avant docker build.
      - name: Copy mini-mlops runtime into backend build context
        run: |
          rm -rf mlops-backend/mlops-backend/mini-mlops
          cp -r mini-mlops mlops-backend/mlops-backend/mini-mlops

          echo "Checking mini-mlops runtime copied into backend context..."
          ls -la mlops-backend/mlops-backend/mini-mlops/src/custom_models

          echo "Checking corrected platform_runner.py exists..."
          test -f mlops-backend/mlops-backend/mini-mlops/src/custom_models/platform_runner.py

          echo "Checking PLATFORM_RECOVERY logic exists..."
          grep -n "PLATFORM_RECOVERY\|USER_MLFLOW_FAILURE\|Recovery completed" mlops-backend/mlops-backend/mini-mlops/src/custom_models/platform_runner.py

      # Étape 6 : construire l’image Docker backend
      - name: Build backend Docker image
        working-directory: mlops-backend/mlops-backend
        run: |
          docker build --pull -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:latest .

      # Étape 7 : pousser l’image backend vers Docker Hub
      - name: Push backend Docker image
        run: |
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:latest

      # ==============================
      # FRONTEND ANGULAR
      # ==============================

      # Étape 8 : installer Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Étape 9 : installer les dépendances frontend
      - name: Install frontend dependencies
        working-directory: front-end/free-angular-tailwind-dashboard
        run: npm ci

      # Étape 10 : builder Angular
      - name: Build frontend
        working-directory: front-end/free-angular-tailwind-dashboard
        run: npm run build

      # Étape 11 : construire l’image frontend
      - name: Build frontend Docker image
        working-directory: front-end/free-angular-tailwind-dashboard
        run: |
          docker build --pull -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-frontend:latest .

      # Étape 12 : pousser l’image frontend vers Docker Hub
      - name: Push frontend Docker image
        run: |
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-frontend:latest