# Nom du workflow affiché dans l’onglet Actions de GitHub
name: Build and Push Docker Images

# Déclenchement du pipeline
# Ici : le workflow se lance automatiquement à chaque git push sur la branche main
on:
  push:
    branches:
      - main

jobs:
  # Nom du job principal
  build-and-push:
    # GitHub va créer une machine virtuelle Linux temporaire pour exécuter le pipeline
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : récupérer le code source du repository GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # Étape 2 : connexion à Docker Hub
      # DOCKERHUB_USERNAME et DOCKERHUB_TOKEN sont stockés dans :
      # GitHub repo → Settings → Secrets and variables → Actions
      #
      # Important :
      # username doit être le même compte Docker Hub que celui qui a généré le token.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==============================
      # BACKEND SPRING BOOT
      # ==============================

      # Étape 3 : installer Java 17 dans la machine GitHub Actions
      # Ton backend Spring Boot utilise Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Étape 4 : compiler le backend et générer le fichier .jar
      # working-directory indique où se trouve le pom.xml
      #
      # chmod +x mvnw : donne le droit d’exécution au Maven Wrapper sous Linux
      # ./mvnw clean package -DskipTests : génère target/*.jar
      - name: Build backend JAR
        working-directory: mlops-backend/mlops-backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # Étape 5 : construire l’image Docker du backend
      # Le Dockerfile backend copie target/*.jar dans l’image
      #
      # Ici l’image sera :
      # docker.io/<DOCKERHUB_USERNAME>/mlops-backend:latest
      - name: Build backend Docker image
        working-directory: mlops-backend/mlops-backend
        run: |
          docker build -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:latest .

      # Étape 6 : pousser l’image backend vers Docker Hub
      - name: Push backend Docker image
        run: |
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:latest

      # ==============================
      # FRONTEND ANGULAR
      # ==============================

      # Étape 7 : installer Node.js pour builder Angular
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Étape 8 : installer les dépendances frontend
      # npm ci utilise package-lock.json, donc c’est plus stable pour CI/CD que npm install
      - name: Install frontend dependencies
        working-directory: front-end/free-angular-tailwind-dashboard
        run: npm ci

      # Étape 9 : builder l’application Angular
      # Cela génère le dossier dist/
      - name: Build frontend
        working-directory: front-end/free-angular-tailwind-dashboard
        run: npm run build

      # Étape 10 : construire l’image Docker frontend
      # Le Dockerfile frontend met le build Angular dans Nginx
      #
      # Ici l’image sera :
      # docker.io/<DOCKERHUB_USERNAME>/mlops-frontend:latest
      - name: Build frontend Docker image
        working-directory: front-end/free-angular-tailwind-dashboard
        run: |
          docker build -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-frontend:latest .

      # Étape 11 : pousser l’image frontend vers Docker Hub
      - name: Push frontend Docker image
        run: |
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-frontend:latest