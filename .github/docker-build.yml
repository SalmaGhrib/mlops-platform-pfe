name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build backend JAR
        working-directory: mlops-backend/mlops-backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build backend Docker image
        working-directory: mlops-backend/mlops-backend
        run: |
          docker build -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:latest .

      - name: Push backend Docker image
        run: |
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: front-end/free-angular-tailwind-dashboard
        run: npm ci

      - name: Build frontend
        working-directory: front-end/free-angular-tailwind-dashboard
        run: npm run build

      - name: Build frontend Docker image
        working-directory: front-end/free-angular-tailwind-dashboard
        run: |
          docker build -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-frontend:latest .

      - name: Push frontend Docker image
        run: |
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mlops-frontend:latest