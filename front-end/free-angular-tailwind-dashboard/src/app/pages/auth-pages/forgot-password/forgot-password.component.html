<div class="min-h-screen bg-gray-50 px-4 py-12 dark:bg-gray-950">
  <div class="mx-auto flex min-h-[70vh] max-w-md items-center justify-center">
    <div class="w-full rounded-2xl border border-gray-200 bg-white p-8 shadow-sm dark:border-gray-800 dark:bg-gray-900">
      <h1 class="text-2xl font-semibold text-gray-900 dark:text-white">
        Mot de passe oublié
      </h1>

      <p class="mt-3 text-sm text-gray-500 dark:text-gray-400">
        Entrez votre adresse email. Nous vous enverrons un lien pour réinitialiser votre mot de passe.
      </p>

      <form class="mt-6 space-y-5" (ngSubmit)="onSubmit()">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Adresse email
          </label>

          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-blue-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
            placeholder="exemple@email.com"
          />
        </div>

        @if (errorMessage) {
          <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-900/50 dark:bg-red-900/20 dark:text-red-300">
            {{ errorMessage }}
          </div>
        }

        @if (successMessage) {
          <div class="rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700 dark:border-green-900/50 dark:bg-green-900/20 dark:text-green-300">
            {{ successMessage }}
          </div>
        }

        <button
          type="submit"
          [disabled]="loading"
          class="w-full rounded-lg bg-blue-600 px-5 py-3 text-sm font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
        >
          @if (loading) {
            Envoi en cours...
          } @else {
            Envoyer le lien
          }
        </button>
      </form>

      <div class="mt-6 text-center">
        <a routerLink="/signin" class="text-sm font-medium text-blue-600 hover:text-blue-700">
          Retour à la connexion
        </a>
      </div>
    </div>
  </div>
</div>
