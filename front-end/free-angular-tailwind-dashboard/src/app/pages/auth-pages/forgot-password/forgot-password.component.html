<div class="min-h-screen bg-gray-50 px-4 py-12 dark:bg-gray-950">
  <div class="mx-auto flex min-h-[70vh] max-w-md items-center justify-center">
    <div class="mlops-fade-in w-full rounded-2xl border border-gray-200 bg-white p-8 shadow-lg shadow-gray-200/60 dark:border-gray-800 dark:bg-gray-900 dark:shadow-none">
      <div class="mb-6 flex h-12 w-12 items-center justify-center rounded-xl bg-brand-50 text-brand-600 dark:bg-brand-500/10 dark:text-brand-400">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
      </div>

      <h1 class="text-2xl font-semibold text-gray-900 dark:text-white">
        Mot de passe oublié
      </h1>

      <p class="mt-3 text-sm text-gray-500 dark:text-gray-400">
        Entrez votre adresse email. Nous vous enverrons un lien pour réinitialiser votre mot de passe.
      </p>

      <form class="mt-6 space-y-5" (ngSubmit)="onSubmit()">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Adresse email
          </label>

          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-blue-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
            placeholder="exemple@email.com"
          />
        </div>

        @if (errorMessage) {
          <div class="flex items-start gap-3 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-900/50 dark:bg-red-900/20 dark:text-red-300">
            <svg class="mt-0.5 h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
            <span>{{ errorMessage }}</span>
          </div>
        }

        @if (successMessage) {
          <div class="flex items-start gap-3 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700 dark:border-green-900/50 dark:bg-green-900/20 dark:text-green-300">
            <svg class="mt-0.5 h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>{{ successMessage }}</span>
          </div>
        }

        <button
          type="submit"
          [disabled]="loading"
          class="flex w-full items-center justify-center gap-2 rounded-lg bg-brand-500 px-5 py-3 text-sm font-medium text-white transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60"
        >
          @if (loading) {
            <span class="mlops-spinner h-4 w-4 border-2 text-white"></span>
            Envoi en cours...
          } @else {
            Envoyer le lien
          }
        </button>
      </form>

      <div class="mt-6 text-center">
        <a routerLink="/signin" class="text-sm font-medium text-blue-600 hover:text-blue-700">
          Retour à la connexion
        </a>
      </div>
    </div>
  </div>
</div>
