apiVersion: v1
kind: Pod
metadata:
  name: kv-test-pod
  namespace: mlops
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sleep
        - "3600"
      volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
  volumes:
    - name: secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "kv-mlops-test"