apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: mlops
  labels:
    app: mysql
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mlops-platform

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: mlops-platform

    spec:
      terminationGracePeriodSeconds: 90

      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE

          args:
            - --default-authentication-plugin=mysql_native_password
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci

            # Standalone (ni réplication ni PITR) : les binlogs inutiles
            # remplissaient le disque de 32G (39+ fichiers de 1,1G).
            - --skip-log-bin

            # Limite raisonnable pour éviter la saturation.
            - --max-connections=100

            # Réglages InnoDB adaptés à la limite mémoire de 2 GiB.
            - --innodb-buffer-pool-size=768M
            - --innodb-redo-log-capacity=256M
            - --innodb-log-buffer-size=64M

            # Réduit les COMMIT très lents sur le stockage Azure.
            - --innodb-flush-log-at-trx-commit=2
            - --sync-binlog=0

            # Timeouts réseau.
            - --connect-timeout=20
            - --net-read-timeout=120
            - --net-write-timeout=120

            # Nettoyage des connexions inactives.
            - --wait-timeout=600
            - --interactive-timeout=600

            # Évite les attentes de verrous trop longues.
            - --innodb-lock-wait-timeout=30

            # Évite les résolutions DNS inutiles des clients MySQL.
            - --skip-name-resolve

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1500m"
              memory: "2Gi"

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - mysqladmin shutdown -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" || true

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

            - name: keyvault-secrets
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc

        - name: keyvault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-keyvault-secrets
