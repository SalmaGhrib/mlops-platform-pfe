apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlflow
  namespace: mlops
  labels:
    app: mlflow

spec:
  replicas: 1

  revisionHistoryLimit: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: mlflow

  template:
    metadata:
      labels:
        app: mlflow

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: mlflow

          image: ghcr.io/mlflow/mlflow:v3.1.1
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -c

          args:
            - >
              mlflow server
              --host 0.0.0.0
              --port 5000
              --backend-store-uri sqlite:////mlflow/mlflow.db
              --serve-artifacts
              --artifacts-destination /mlflow/artifacts

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"

            limits:
              cpu: "1500m"
              memory: "2Gi"

          startupProbe:
            tcpSocket:
              port: 5000
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          volumeMounts:
            - name: mlflow-storage
              mountPath: /mlflow

      volumes:
        - name: mlflow-storage
          persistentVolumeClaim:
            claimName: mlflow-pvc