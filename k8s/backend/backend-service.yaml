apiVersion: v1
kind: Service

metadata:
  name: mlops-backend-service
  namespace: mlops
  labels:
    app: mlops-backend
    app.kubernetes.io/name: mlops-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: mlops-platform

spec:
  type: ClusterIP

  selector:
    app: mlops-backend

  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: http