apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlops-backend
  namespace: mlops
  labels:
    app: mlops-backend
    app.kubernetes.io/name: mlops-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: mlops-platform

spec:
  # Ne pas fixer replicas ici :
  # le nombre de pods est maintenant géré par le HPA.
  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: mlops-backend

  template:
    metadata:
      labels:
        app: mlops-backend
        app.kubernetes.io/name: mlops-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: mlops-platform

      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"

    spec:
      serviceAccountName: mlops-backend-sa
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

      containers:
        - name: mlops-backend

          image: acrmlopssalmav2.azurecr.io/mlops-backend:mlops-pilot-api-keys-v3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          env:
            # Prometheus utilisé par le monitoring
            - name: MONITORING_PROMETHEUS_URL
              value: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"

            - name: PROMETHEUS_URL
              value: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret

          # Important pour le fonctionnement du HPA.
          # Le HPA CPU calcule son pourcentage par rapport à requests.cpu.
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"

            limits:
              cpu: "1500m"
              memory: "2Gi"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1

          volumeMounts:
            # Volume partagé entre plusieurs pods / plusieurs nodes
            - name: backend-uploads
              mountPath: /app/uploads

            # Azure Key Vault via Secrets Store CSI
            - name: keyvault-secrets
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        # Nouveau PVC RWX basé sur Azure Files
        - name: backend-uploads
          persistentVolumeClaim:
            claimName: backend-uploads-rwx-pvc

        - name: keyvault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-keyvault-secrets
