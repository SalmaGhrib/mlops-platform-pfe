apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: mlops
data:
  SERVER_PORT: "8081"

  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service:3306/mlops_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "root"

  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_OPEN_IN_VIEW: "true"

  APP_UPLOAD_DIR: "/app/uploads"

  APP_MLFLOW_TRACKING_URL: "http://mlflow-service:5000"
  APP_MLFLOW_TRACKING_URI: "http://mlflow-service:5000"
  MLFLOW_TRACKING_URI: "http://mlflow-service:5000"

  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
  MANAGEMENT_METRICS_TAGS_APPLICATION: "mlops-backend"

  LOGGING_LEVEL_ROOT: "WARN"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: "WARN"
  LOGGING_LEVEL_ORG_HIBERNATE: "ERROR"
  LOGGING_LEVEL_COM_MLOPS_PLATFORM: "INFO"

  APP_KUBERNETES_NAMESPACE: "mlops"

  APP_CUSTOM_DOCKER_WATCHER_ENABLED: "false"
  APP_MLOPS_AUTO_SYNC_ENABLED: "false"
  APP_MLOPS_AUTO_DEPLOY_ENABLED: "false"
  APP_MLOPS_PRODUCTION_RECONCILER_ENABLED: "false"