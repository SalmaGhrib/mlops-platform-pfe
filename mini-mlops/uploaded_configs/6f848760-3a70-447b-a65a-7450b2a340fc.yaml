  entrypoint: 42fd1cf8-f094-4cf1-aedf-fa911f15bb97.py
  files:
    42fd1cf8-f094-4cf1-aedf-fa911f15bb97.py: "import json\nimport os\nimport joblib\n\
      import pandas as pd\n\nfrom sklearn.model_selection import train_test_split\n\
      from sklearn.pipeline import Pipeline\nfrom sklearn.feature_extraction.text\
      \ import TfidfVectorizer\nfrom sklearn.linear_model import LogisticRegression\n\
      from sklearn.metrics import (\n    accuracy_score,\n    f1_score,\n    precision_score,\n\
      \    recall_score,\n    log_loss\n)\n\n# ============================================================\n\
      # Configuration\n# ============================================================\n\
      \nDATASET_PATH = os.getenv(\"DATA_PATH\", \"text_sentiment_dataset.csv\")\n\
      OUTPUT_DIR = os.getenv(\"OUTPUT_DIR\", \"outputs\")\n\nTARGET_COLUMN = \"label\"\
      \nTEXT_COLUMN = \"text\"\n\nos.makedirs(OUTPUT_DIR, exist_ok=True)\n\n# ============================================================\n\
      # 1. Load dataset\n# ============================================================\n\
      \ndf = pd.read_csv(DATASET_PATH)\n\nrequired_columns = [TEXT_COLUMN, TARGET_COLUMN]\n\
      missing_columns = [col for col in required_columns if col not in df.columns]\n\
      \nif missing_columns:\n    raise ValueError(\n        f\"Colonnes manquantes\
      \ dans le dataset: {missing_columns}. \"\n        f\"Colonnes disponibles: {list(df.columns)}\"\
      \n    )\n\ndf = df.dropna(subset=[TEXT_COLUMN, TARGET_COLUMN])\n\nif df.empty:\n\
      \    raise ValueError(\"Dataset vide après suppression des valeurs manquantes.\"\
      )\n\nX = df[TEXT_COLUMN].astype(str)\ny = df[TARGET_COLUMN].astype(str)\n\n\
      if y.nunique() < 2:\n    raise ValueError(\"Le dataset doit contenir au moins\
      \ 2 classes différentes.\")\n\n# ============================================================\n\
      # 2. Train/test split\n# ============================================================\n\
      \nclass_counts = y.value_counts()\ncan_stratify = class_counts.min() >= 2\n\n\
      X_train, X_test, y_train, y_test = train_test_split(\n    X,\n    y,\n    test_size=0.25,\n\
      \    random_state=42,\n    stratify=y if can_stratify else None\n)\n\n# ============================================================\n\
      # 3. Build NLP pipeline\n# Important: TfidfVectorizer + LogisticRegression are\
      \ saved together\n# ============================================================\n\
      \nmodel = Pipeline([\n    (\"tfidf\", TfidfVectorizer(\n        lowercase=True,\n\
      \        ngram_range=(1, 2),\n        max_features=5000\n    )),\n    (\"classifier\"\
      , LogisticRegression(\n        max_iter=1000,\n        random_state=42\n   \
      \ ))\n])\n\n# ============================================================\n\
      # 4. Train model\n# ============================================================\n\
      \nmodel.fit(X_train, y_train)\n\n# ============================================================\n\
      # 5. Evaluate model\n# ============================================================\n\
      \ny_pred = model.predict(X_test)\n\nmetrics = {\n    \"accuracy\": float(accuracy_score(y_test,\
      \ y_pred)),\n    \"f1_score\": float(f1_score(y_test, y_pred, average=\"weighted\"\
      , zero_division=0)),\n    \"precision\": float(precision_score(y_test, y_pred,\
      \ average=\"weighted\", zero_division=0)),\n    \"recall\": float(recall_score(y_test,\
      \ y_pred, average=\"weighted\", zero_division=0))\n}\n\ntry:\n    y_proba =\
      \ model.predict_proba(X_test)\n    metrics[\"log_loss\"] = float(log_loss(y_test,\
      \ y_proba, labels=model.classes_))\nexcept Exception as exc:\n    print(f\"\
      log_loss could not be calculated: {exc}\")\n\n# ============================================================\n\
      # 6. Test prediction before saving\n# This confirms the TF-IDF vectorizer is\
      \ fitted\n# ============================================================\n\n\
      sample_text = [\"le service est rapide et excellent\"]\nsample_prediction =\
      \ model.predict(sample_text)[0]\n\nprint(\"NLP standard model trained successfully\"\
      )\nprint(\"sample_prediction=\", sample_prediction)\n\nfor key, value in metrics.items():\n\
      \    print(f\"{key}={value}\")\n\n# ============================================================\n\
      # 7. Save artifacts\n# VERY IMPORTANT FOR YOUR PLATFORM:\n# Save the trained\
      \ pipeline in outputs/model.pkl\n# ============================================================\n\
      \nmodel_path_outputs = os.path.join(OUTPUT_DIR, \"model.pkl\")\nmetrics_path_outputs\
      \ = os.path.join(OUTPUT_DIR, \"metrics.json\")\n\njoblib.dump(model, model_path_outputs)\n\
      \nwith open(metrics_path_outputs, \"w\", encoding=\"utf-8\") as f:\n    json.dump(metrics,\
      \ f, indent=2)\n\n# Optional backup files at root level\njoblib.dump(model,\
      \ \"model.joblib\")\n\nwith open(\"metrics.json\", \"w\", encoding=\"utf-8\"\
      ) as f:\n    json.dump(metrics, f, indent=2)\n\nprint(f\"model_saved_to={model_path_outputs}\"\
      )\nprint(f\"metrics_saved_to={metrics_path_outputs}\")"
