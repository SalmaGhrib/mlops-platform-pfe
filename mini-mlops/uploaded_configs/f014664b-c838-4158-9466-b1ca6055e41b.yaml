  entrypoint: d4ca4180-dcbc-4e52-bb94-a4f32030e1ed.py
  files:
    d4ca4180-dcbc-4e52-bb94-a4f32030e1ed.py: "\"\"\"\nScript d'entraînement simple\
      \ — Test plateforme MLOps\nBibliothèques utilisées : pandas, scikit-learn, joblib,\
      \ scipy, seaborn\nToutes déjà présentes dans les requirements de la plateforme.\n\
      \"\"\"\n\nimport argparse\nimport os\n\nimport joblib\nimport pandas as pd\n\
      import numpy as np\nfrom scipy import stats\nfrom sklearn.ensemble import GradientBoostingClassifier\n\
      from sklearn.metrics import accuracy_score, f1_score, precision_score, recall_score\n\
      from sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing\
      \ import LabelEncoder, StandardScaler\n\n# ── Arguments CLI ─────────────────────────────────────────────────────────────\n\
      parser = argparse.ArgumentParser()\nparser.add_argument(\"--data_path\",  required=True,\
      \  help=\"Chemin du dataset CSV\")\nparser.add_argument(\"--output_dir\", default=\"\
      outputs\", help=\"Dossier de sortie\")\nargs = parser.parse_args()\n\nprint(\"\
      Simple Training Script — Starting...\")\nprint(f\"data_path={args.data_path}\"\
      )\nprint(f\"output_dir={args.output_dir}\")\n\n# ── Chargement des données ────────────────────────────────────────────────────\n\
      df = pd.read_csv(args.data_path)\nprint(f\"Dataset shape: {df.shape}\")\nprint(f\"\
      Columns: {list(df.columns)}\")\n\n# ── Détection de la colonne cible ─────────────────────────────────────────────\n\
      target_candidates = [\"target\", \"label\", \"class\", \"y\", \"output\", \"\
      churn\", \"success\"]\ntarget_col = None\nfor candidate in target_candidates:\n\
      \    if candidate in df.columns:\n        target_col = candidate\n        break\n\
      if target_col is None:\n    target_col = df.columns[-1]\n\nprint(f\"Target column:\
      \ {target_col}\")\n\nX = df.drop(columns=[target_col])\ny = df[target_col]\n\
      \n# Encodage colonnes textuelles\nX = pd.get_dummies(X)\n\n# Encodage target\
      \ si textuelle\nif y.dtype == object:\n    le = LabelEncoder()\n    y = le.fit_transform(y)\n\
      \n# ── Nettoyage avec scipy — suppression des outliers ───────────────────────────\n\
      X_array = X.values\nz_scores = np.abs(stats.zscore(X_array))\nmask = (z_scores\
      \ < 3).all(axis=1)\nX = X[mask]\ny = y[mask]\nprint(f\"After outlier removal:\
      \ {X.shape[0]} rows remaining\")\n\n# ── Prétraitement ─────────────────────────────────────────────────────────────\n\
      scaler   = StandardScaler()\nX_scaled = scaler.fit_transform(X)\n\nX_train,\
      \ X_test, y_train, y_test = train_test_split(\n    X_scaled, y, test_size=0.2,\
      \ random_state=42\n)\n\n# ── Entraînement — GradientBoostingClassifier (sklearn)\
      \ ───────────────────────\nmodel = GradientBoostingClassifier(\n    n_estimators=100,\n\
      \    learning_rate=0.1,\n    max_depth=4,\n    random_state=42\n)\n\nmodel.fit(X_train,\
      \ y_train)\n\n# ── Évaluation ────────────────────────────────────────────────────────────────\n\
      y_pred = model.predict(X_test)\n\naccuracy  = accuracy_score(y_test, y_pred)\n\
      f1        = f1_score(y_test, y_pred, average=\"weighted\", zero_division=0)\n\
      precision = precision_score(y_test, y_pred, average=\"weighted\", zero_division=0)\n\
      recall    = recall_score(y_test, y_pred, average=\"weighted\", zero_division=0)\n\
      \n# ── Métriques au format plateforme ────────────────────────────────────────────\n\
      print(f\"accuracy={accuracy}\")\nprint(f\"f1_score={f1}\")\nprint(f\"precision={precision}\"\
      )\nprint(f\"recall={recall}\")\n\n# ── Sauvegarde ────────────────────────────────────────────────────────────────\n\
      os.makedirs(args.output_dir, exist_ok=True)\nmodel_path = os.path.join(args.output_dir,\
      \ \"model.pkl\")\njoblib.dump(model, model_path)\n\nprint(f\"Model saved to\
      \ {model_path}\")\nprint(\"Training completed successfully.\")\n"
