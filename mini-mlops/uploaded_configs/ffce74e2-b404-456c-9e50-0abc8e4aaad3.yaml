  files:
    f3da1fad-1c53-403c-b8c5-842bf89df7d1.py: "\"\"\"\nCustom regression model for\
      \ Mini MLOps testing.\n\nRole of this model:\n- Predict apartment rent price\
      \ from numerical housing features.\n- It is a regression model, so the expected\
      \ metrics are rmse, mae and r2.\n- It is useful to test metric switching in\
      \ your platform:\n  primary metric = rmse or mae -> direction min\n  primary\
      \ metric = r2 -> direction max\n\nExpected dataset target column:\nrent_price\n\
      \"\"\"\n\nfrom sklearn.ensemble import RandomForestRegressor\n\n\ndef get_model():\n\
      \    \"\"\"\n    Returns the sklearn regression model used by the pipeline.\n\
      \n    RandomForestRegressor is chosen because:\n    - it works well on tabular\
      \ data\n    - it captures non-linear relationships\n    - it does not require\
      \ feature scaling\n    - it is simple and reliable for MLOps testing\n    \"\
      \"\"\n    return RandomForestRegressor(\n        n_estimators=120,\n       \
      \ max_depth=10,\n        min_samples_split=4,\n        min_samples_leaf=2,\n\
      \        random_state=42,\n        n_jobs=-1\n    )\n\n\ndef create_model():\n\
      \    \"\"\"\n    Compatibility alias.\n    Some loaders call create_model()\
      \ instead of get_model().\n    \"\"\"\n    return get_model()\n\n\ndef build_model():\n\
      \    \"\"\"\n    Compatibility alias.\n    Some custom runners call build_model()\
      \ instead of get_model().\n    \"\"\"\n    return get_model()\n\n\nMODEL = get_model()\n"
