    5d9e695f-dcba-4c4f-827c-9e057348e0e1.py: "import json\nimport re\nimport joblib\n\
      import pandas as pd\n\nfrom sklearn.model_selection import train_test_split\n\
      from sklearn.pipeline import Pipeline\nfrom sklearn.feature_extraction.text\
      \ import CountVectorizer, TfidfTransformer\nfrom sklearn.svm import LinearSVC\n\
      from sklearn.metrics import accuracy_score, f1_score, precision_score, recall_score\n\
      \nDATASET_PATH = \"text_sentiment_dataset.csv\"\nTARGET_COLUMN = \"label\"\n\
      TEXT_COLUMN = \"text\"\n\ndef clean_text(value: str) -> str:\n    value = str(value).lower()\n\
      \    value = re.sub(r\"[^a-zàâçéèêëîïôûùüÿñæœ0-9\\s]\", \" \", value)\n    value\
      \ = re.sub(r\"\\s+\", \" \", value).strip()\n    return value\n\ndf = pd.read_csv(DATASET_PATH)\n\
      df = df.dropna(subset=[TEXT_COLUMN, TARGET_COLUMN])\ndf[TEXT_COLUMN] = df[TEXT_COLUMN].apply(clean_text)\n\
      \nX = df[TEXT_COLUMN].astype(str)\ny = df[TARGET_COLUMN].astype(str)\n\nX_train,\
      \ X_test, y_train, y_test = train_test_split(\n    X,\n    y,\n    test_size=0.25,\n\
      \    random_state=42,\n    stratify=y\n)\n\nmodel = Pipeline([\n    (\"bow\"\
      , CountVectorizer(\n        ngram_range=(1, 2),\n        min_df=1\n    )),\n\
      \    (\"tfidf\", TfidfTransformer()),\n    (\"classifier\", LinearSVC(random_state=42))\n\
      ])\n\nmodel.fit(X_train, y_train)\n\ny_pred = model.predict(X_test)\n\nmetrics\
      \ = {\n    \"accuracy\": float(accuracy_score(y_test, y_pred)),\n    \"f1_score\"\
      : float(f1_score(y_test, y_pred, average=\"weighted\")),\n    \"precision\"\
      : float(precision_score(y_test, y_pred, average=\"weighted\", zero_division=0)),\n\
      \    \"recall\": float(recall_score(y_test, y_pred, average=\"weighted\", zero_division=0))\n\
      }\n\nprint(\"Custom Docker NLP model trained successfully\")\nfor key, value\
      \ in metrics.items():\n    print(f\"{key}={value}\")\n\njoblib.dump(model, \"\
      model.joblib\")\n\nwith open(\"metrics.json\", \"w\", encoding=\"utf-8\") as\
      \ f:\n    json.dump(metrics, f, indent=2)\n\nsample = [\"interface rapide claire\
      \ et agréable\"]\nprint(\"sample_prediction=\", model.predict(sample)[0])\n"
