  entrypoint: 46ae8b80-4955-431b-9268-feef5c6dc439.py
  files:
    46ae8b80-4955-431b-9268-feef5c6dc439.py: "import numpy as np\r\nimport joblib\r\
      \nfrom imblearn.ensemble import EasyEnsembleClassifier\r\nfrom sklearn.calibration\
      \ import CalibratedClassifierCV\r\nfrom sklearn.metrics import (\r\n    roc_auc_score,\r\
      \n    average_precision_score,\r\n    precision_recall_curve,\r\n    precision_recall_fscore_support,\r\
      \n)\r\n\r\n\r\nSEED = 42\r\n\r\n\r\nclass EasyEnsemblePDModel:\r\n    \"\"\"\
      \r\n    Probability of Default (PD) model using EasyEnsembleClassifier.\r\n\r\
      \n    Features:\r\n    - Handles highly imbalanced datasets\r\n    - Threshold\
      \ tuning using validation data\r\n    - Probability calibration with Platt Scaling\r\
      \n    - Save/load pipeline for production deployment\r\n    \"\"\"\r\n\r\n \
      \   def __init__(self):\r\n        self.model = EasyEnsembleClassifier(\r\n\
      \            n_estimators=20,\r\n            sampling_strategy='auto',\r\n \
      \           random_state=SEED,\r\n            n_jobs=-1,\r\n        )\r\n\r\n\
      \        self.calibrated_model = None\r\n        self.best_threshold = 0.5\r\
      \n\r\n    # ------------------------------------------------------------------\r\
      \n    # TRAINING\r\n    # ------------------------------------------------------------------\r\
      \n    def train(self, X_train, y_train):\r\n        \"\"\"Train EasyEnsemble\
      \ model.\"\"\"\r\n        print('Training EasyEnsembleClassifier...')\r\n  \
      \      self.model.fit(X_train, y_train)\r\n        print('Training completed.')\r\
      \n\r\n    # ------------------------------------------------------------------\r\
      \n    # THRESHOLD TUNING\r\n    # ------------------------------------------------------------------\r\
      \n    def tune_threshold(self, X_val, y_val):\r\n        \"\"\"\r\n        Tune\
      \ classification threshold using validation set.\r\n        Optimizes F1-score.\r\
      \n        \"\"\"\r\n\r\n        y_prob = self.model.predict_proba(X_val)[:,\
      \ 1]\r\n\r\n        precision, recall, thresholds = precision_recall_curve(y_val,\
      \ y_prob)\r\n\r\n        best_f1 = 0\r\n        best_threshold = 0.5\r\n\r\n\
      \        for thr in thresholds:\r\n            y_pred = (y_prob >= thr).astype(int)\r\
      \n\r\n            p, r, f1, _ = precision_recall_fscore_support(\r\n       \
      \         y_val,\r\n                y_pred,\r\n                average='binary',\r\
      \n                zero_division=0,\r\n            )\r\n\r\n            if f1\
      \ > best_f1:\r\n                best_f1 = f1\r\n                best_threshold\
      \ = thr\r\n\r\n        self.best_threshold = float(best_threshold)\r\n\r\n \
      \       print(f'Best threshold found: {self.best_threshold:.4f}')\r\n      \
      \  print(f'Best F1-score        : {best_f1:.4f}')\r\n\r\n        return self.best_threshold\r\
      \n\r\n    # ------------------------------------------------------------------\r\
      \n    # CALIBRATION\r\n    # ------------------------------------------------------------------\r\
      \n    def calibrate(self, X_val, y_val):\r\n        \"\"\"\r\n        Apply\
      \ Platt Scaling (sigmoid calibration).\r\n        Helps produce realistic PD\
      \ probabilities.\r\n        \"\"\"\r\n\r\n        print('Calibrating probabilities\
      \ using Platt Scaling...')\r\n\r\n        self.calibrated_model = CalibratedClassifierCV(\r\
      \n            self.model,\r\n            method='sigmoid',\r\n            cv='prefit',\r\
      \n        )\r\n\r\n        self.calibrated_model.fit(X_val, y_val)\r\n\r\n \
      \       print('Calibration completed.')\r\n\r\n    # ------------------------------------------------------------------\r\
      \n    # PREDICTION\r\n    # ------------------------------------------------------------------\r\
      \n    def predict_proba(self, X, calibrated=True):\r\n        \"\"\"Return predicted\
      \ probabilities.\"\"\"\r\n\r\n        if calibrated and self.calibrated_model\
      \ is not None:\r\n            return self.calibrated_model.predict_proba(X)[:,\
      \ 1]\r\n\r\n        return self.model.predict_proba(X)[:, 1]\r\n\r\n    def\
      \ predict(self, X, threshold=None, calibrated=True):\r\n        \"\"\"Return\
      \ binary predictions using tuned threshold.\"\"\"\r\n\r\n        if threshold\
      \ is None:\r\n            threshold = self.best_threshold\r\n\r\n        probs\
      \ = self.predict_proba(X, calibrated=calibrated)\r\n\r\n        return (probs\
      \ >= threshold).astype(int)\r\n\r\n    # ------------------------------------------------------------------\r\
      \n    # EVALUATION\r\n    # ------------------------------------------------------------------\r\
      \n    def evaluate(self, X_test, y_test, calibrated=True):\r\n        \"\"\"\
      Evaluate model performance.\"\"\"\r\n\r\n        y_prob = self.predict_proba(X_test,\
      \ calibrated=calibrated)\r\n        y_pred = self.predict(\r\n            X_test,\r\
      \n            threshold=self.best_threshold,\r\n            calibrated=calibrated,\r\
      \n        )\r\n\r\n        precision, recall, f1, _ = precision_recall_fscore_support(\r\
      \n            y_test,\r\n            y_pred,\r\n            average='binary',\r\
      \n            zero_division=0,\r\n        )\r\n\r\n        auc = roc_auc_score(y_test,\
      \ y_prob)\r\n        pr_auc = average_precision_score(y_test, y_prob)\r\n  \
      \      gini = 2 * auc - 1\r\n\r\n        results = {\r\n            'AUC': round(auc,\
      \ 4),\r\n            'Gini': round(gini, 4),\r\n            'PR-AUC': round(pr_auc,\
      \ 4),\r\n            'Recall': round(recall, 4),\r\n            'Precision':\
      \ round(precision, 4),\r\n            'F1': round(f1, 4),\r\n            'Threshold':\
      \ round(self.best_threshold, 4),\r\n        }\r\n\r\n        print('\\n=== Model\
      \ Evaluation ===')\r\n        for k, v in results.items():\r\n            print(f'{k:<12}:\
      \ {v}')\r\n\r\n        return results\r\n\r\n    # ------------------------------------------------------------------\r\
      \n    # SAVE / LOAD\r\n    # ------------------------------------------------------------------\r\
      \n    def save(self, path='easy_ensemble_model.joblib'):\r\n        \"\"\"Save\
      \ trained model.\"\"\"\r\n\r\n        payload = {\r\n            'model': self.model,\r\
      \n            'calibrated_model': self.calibrated_model,\r\n            'best_threshold':\
      \ self.best_threshold,\r\n        }\r\n\r\n        joblib.dump(payload, path)\r\
      \n        print(f'Model saved to: {path}')\r\n\r\n    def load(self, path='easy_ensemble_model.joblib'):\r\
      \n        \"\"\"Load trained model.\"\"\"\r\n\r\n        payload = joblib.load(path)\r\
      \n\r\n        self.model = payload['model']\r\n        self.calibrated_model\
      \ = payload['calibrated_model']\r\n        self.best_threshold = payload['best_threshold']\r\
      \n\r\n        print(f'Model loaded from: {path}')\r\n\r\n\r\n# ----------------------------------------------------------------------\r\
      \n# EXAMPLE USAGE\r\n# ----------------------------------------------------------------------\r\
      \nif __name__ == '__main__':\r\n    \"\"\"\r\n    Example workflow:\r\n\r\n\
      \    model = EasyEnsemblePDModel()\r\n\r\n    model.train(X_train, y_train)\r\
      \n\r\n    model.tune_threshold(X_val, y_val)\r\n\r\n    model.calibrate(X_val,\
      \ y_val)\r\n\r\n    model.evaluate(X_test, y_test)\r\n\r\n    model.save('easy_ensemble_credit_model.joblib')\r\
      \n    \"\"\"\r\n\r\n    print('EasyEnsemble PD model module ready.')\r\n"
