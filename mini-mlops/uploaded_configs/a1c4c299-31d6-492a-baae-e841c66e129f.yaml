  files:
    778bd67c-7c4e-4ae2-b18a-adf5cb0a37df.py: "\"\"\"\nScript d'entraînement PyTorch\
      \ — Test plateforme MLOps\nDataset : CSV tabulaire simple (pas besoin de télécharger\
      \ MNIST)\nCompatible avec : --data_path et --output_dir\n\"\"\"\n\nimport argparse\n\
      import os\nfrom pathlib import Path\n\nimport joblib\nimport pandas as pd\n\
      import torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torch.utils.data\
      \ import DataLoader, TensorDataset\nfrom sklearn.model_selection import train_test_split\n\
      from sklearn.preprocessing import LabelEncoder, StandardScaler\nfrom sklearn.metrics\
      \ import accuracy_score, f1_score, precision_score, recall_score\n\n# ── Arguments\
      \ CLI (compatibles avec la plateforme) ───────────────────────────\nparser =\
      \ argparse.ArgumentParser()\nparser.add_argument(\"--data_path\",  required=True,\
      \  help=\"Chemin du dataset CSV\")\nparser.add_argument(\"--output_dir\", default=\"\
      outputs\", help=\"Dossier de sortie\")\nargs = parser.parse_args()\n\nprint(\"\
      PyTorch Training Script — Starting...\")\nprint(f\"data_path={args.data_path}\"\
      )\nprint(f\"output_dir={args.output_dir}\")\n\n# ── Chargement des données ────────────────────────────────────────────────────\n\
      df = pd.read_csv(args.data_path)\nprint(f\"Dataset shape: {df.shape}\")\nprint(f\"\
      Columns: {list(df.columns)}\")\n\n# Détection automatique de la colonne cible\n\
      target_candidates = [\"target\", \"label\", \"class\", \"y\", \"species\", \"\
      output\"]\ntarget_col = None\nfor candidate in target_candidates:\n    if candidate\
      \ in df.columns:\n        target_col = candidate\n        break\nif target_col\
      \ is None:\n    target_col = df.columns[-1]\n\nprint(f\"Target column: {target_col}\"\
      )\n\nX = df.drop(columns=[target_col])\ny = df[target_col]\n\n# Encodage des\
      \ colonnes catégorielles\nX = pd.get_dummies(X)\n\n# Encodage de la target si\
      \ textuelle\nif y.dtype == object:\n    le = LabelEncoder()\n    y = le.fit_transform(y)\n\
      else:\n    y = y.values\n\nnum_classes = len(set(y))\nprint(f\"Number of classes:\
      \ {num_classes}\")\n\n# ── Prétraitement ─────────────────────────────────────────────────────────────\n\
      scaler = StandardScaler()\nX_scaled = scaler.fit_transform(X)\n\nX_train, X_test,\
      \ y_train, y_test = train_test_split(\n    X_scaled, y, test_size=0.2, random_state=42\n\
      )\n\n# Conversion en tenseurs PyTorch\nX_train_t = torch.FloatTensor(X_train)\n\
      y_train_t  = torch.LongTensor(y_train)\nX_test_t   = torch.FloatTensor(X_test)\n\
      y_test_t   = torch.LongTensor(y_test)\n\ntrain_dataset = TensorDataset(X_train_t,\
      \ y_train_t)\ntrain_loader  = DataLoader(train_dataset, batch_size=32, shuffle=True)\n\
      \n# ── Architecture du réseau ────────────────────────────────────────────────────\n\
      input_size = X_train.shape[1]\n\nclass SimpleNet(nn.Module):\n    def __init__(self,\
      \ input_size, num_classes):\n        super(SimpleNet, self).__init__()\n   \
      \     self.fc1 = nn.Linear(input_size, 64)\n        self.relu = nn.ReLU()\n\
      \        self.dropout = nn.Dropout(0.3)\n        self.fc2 = nn.Linear(64, 32)\n\
      \        self.fc3 = nn.Linear(32, num_classes)\n\n    def forward(self, x):\n\
      \        x = self.relu(self.fc1(x))\n        x = self.dropout(x)\n        x\
      \ = self.relu(self.fc2(x))\n        x = self.fc3(x)\n        return x\n\nmodel\
      \     = SimpleNet(input_size, num_classes)\ncriterion = nn.CrossEntropyLoss()\n\
      optimizer = optim.Adam(model.parameters(), lr=0.001)\n\n# ── Entraînement ──────────────────────────────────────────────────────────────\n\
      NUM_EPOCHS = 20\nprint(f\"\\nTraining for {NUM_EPOCHS} epochs...\")\n\nfor epoch\
      \ in range(1, NUM_EPOCHS + 1):\n    model.train()\n    total_loss = 0.0\n\n\
      \    for batch_X, batch_y in train_loader:\n        optimizer.zero_grad()\n\
      \        outputs = model(batch_X)\n        loss    = criterion(outputs, batch_y)\n\
      \        loss.backward()\n        optimizer.step()\n        total_loss += loss.item()\n\
      \n    avg_loss = total_loss / len(train_loader)\n    print(f\"Epoch {epoch}/{NUM_EPOCHS}\
      \ — loss={avg_loss:.4f}\")\n\n# ── Évaluation ────────────────────────────────────────────────────────────────\n\
      model.eval()\nwith torch.no_grad():\n    outputs     = model(X_test_t)\n   \
      \ _, predicted = torch.max(outputs, 1)\n    y_pred = predicted.numpy()\n\naccuracy\
      \  = accuracy_score(y_test, y_pred)\nf1        = f1_score(y_test, y_pred, average=\"\
      weighted\", zero_division=0)\nprecision = precision_score(y_test, y_pred, average=\"\
      weighted\", zero_division=0)\nrecall    = recall_score(y_test, y_pred, average=\"\
      weighted\", zero_division=0)\nfinal_loss = avg_loss\n\n# ── Affichage des métriques\
      \ (format plateforme) ───────────────────────────────\nprint(f\"accuracy={accuracy}\"\
      )\nprint(f\"f1_score={f1}\")\nprint(f\"precision={precision}\")\nprint(f\"recall={recall}\"\
      )\nprint(f\"loss={final_loss}\")\n\n# ── Sauvegarde du modèle ──────────────────────────────────────────────────────\n\
      os.makedirs(args.output_dir, exist_ok=True)\n\n# Sauvegarder le state_dict PyTorch\n\
      torch.save(model.state_dict(), os.path.join(args.output_dir, \"model_pytorch.pt\"\
      ))\n\n# Sauvegarder aussi en .pkl via joblib (requis par la plateforme)\nimport\
      \ pickle\n\nclass PytorchModelWrapper:\n    \"\"\"\n    Wrapper sklearn-compatible\
      \ pour que joblib.dump fonctionne\n    et que la plateforme puisse charger le\
      \ modèle normalement.\n    \"\"\"\n    def __init__(self, model, scaler, input_size,\
      \ num_classes):\n        self.model       = model\n        self.scaler     \
      \ = scaler\n        self.input_size  = input_size\n        self.num_classes\
      \ = num_classes\n\n    def predict(self, X):\n        if not isinstance(X, torch.Tensor):\n\
      \            X_scaled = self.scaler.transform(X)\n            X_t      = torch.FloatTensor(X_scaled)\n\
      \        else:\n            X_t = X\n\n        self.model.eval()\n        with\
      \ torch.no_grad():\n            outputs      = self.model(X_t)\n           \
      \ _, predicted = torch.max(outputs, 1)\n        return predicted.numpy()\n\n\
      \    def predict_proba(self, X):\n        if not isinstance(X, torch.Tensor):\n\
      \            X_scaled = self.scaler.transform(X)\n            X_t      = torch.FloatTensor(X_scaled)\n\
      \        else:\n            X_t = X\n\n        self.model.eval()\n        with\
      \ torch.no_grad():\n            outputs = self.model(X_t)\n            proba\
      \   = torch.softmax(outputs, dim=1)\n        return proba.numpy()\n\nwrapper\
      \    = PytorchModelWrapper(model, scaler, input_size, num_classes)\nmodel_path\
      \ = os.path.join(args.output_dir, \"model.pkl\")\njoblib.dump(wrapper, model_path)\n\
      \nprint(f\"Model saved to {model_path}\")\nprint(\"Training completed successfully.\"\
      )\n"
