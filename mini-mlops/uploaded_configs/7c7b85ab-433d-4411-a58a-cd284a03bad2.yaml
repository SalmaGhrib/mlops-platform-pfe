custom_code:
  source_type: inline
  entrypoint: a7b491de-531c-44df-9221-cc447ef6c859.py
  files:
    a7b491de-531c-44df-9221-cc447ef6c859.py: "import json\nimport joblib\nimport numpy\
      \ as np\nimport pandas as pd\n\nfrom sklearn.model_selection import train_test_split\n\
      from sklearn.pipeline import Pipeline\nfrom sklearn.feature_extraction.text\
      \ import TfidfVectorizer\nfrom sklearn.linear_model import LogisticRegression\n\
      from sklearn.metrics import accuracy_score, f1_score, precision_score, recall_score,\
      \ log_loss\n\n\"\"\"\nScript de test pour valider le changement automatique\
      \ de version production\naprès modification de l'ordre des métriques.\n\nObjectif\
      \ volontaire :\n- Obtenir une très bonne accuracy / f1 / precision / recall\n\
      - Garder un log_loss volontairement moins bon que ton ancien v2\n  pour créer\
      \ un conflit entre les métriques.\n\nRésultat attendu :\n- Si metric priority\
      \ = accuracy / f1_score / precision => ce run doit devenir meilleur.\n- Si metric\
      \ priority = log_loss en priorité 1 => ton ancien v2 peut rester meilleur.\n\
      \"\"\"\n\nDATASET_PATH = \"text_sentiment_dataset_metric_switch.csv\"\nTARGET_COLUMN\
      \ = \"label\"\nTEXT_COLUMN = \"text\"\n\ndf = pd.read_csv(DATASET_PATH)\ndf\
      \ = df.dropna(subset=[TEXT_COLUMN, TARGET_COLUMN])\n\nX = df[TEXT_COLUMN].astype(str)\n\
      y = df[TARGET_COLUMN].astype(str)\n\nX_train, X_test, y_train, y_test = train_test_split(\n\
      \    X,\n    y,\n    test_size=0.25,\n    random_state=7,\n    stratify=y\n\
      )\n\nmodel = Pipeline([\n    (\"tfidf\", TfidfVectorizer(\n        lowercase=True,\n\
      \        ngram_range=(1, 2),\n        max_features=8000\n    )),\n    (\"classifier\"\
      , LogisticRegression(\n        max_iter=1000,\n        C=5.0,\n        random_state=7\n\
      \    ))\n])\n\nmodel.fit(X_train, y_train)\n\ny_pred = model.predict(X_test)\n\
      \n# Probabilités réelles du modèle\nreal_proba = model.predict_proba(X_test)\n\
      \n# Pour tester la logique de sélection, on crée volontairement une probabilité\n\
      # peu confiante autour de 0.51 / 0.49, tout en gardant les classes prédites.\n\
      # Cela rend log_loss moins bon, même si accuracy/f1 sont bons.\nclasses = list(model.classes_)\n\
      forced_proba = np.zeros((len(y_pred), len(classes)))\n\nfor i, pred in enumerate(y_pred):\n\
      \    pred_index = classes.index(pred)\n    if len(classes) == 2:\n        forced_proba[i,\
      \ pred_index] = 0.51\n        forced_proba[i, 1 - pred_index] = 0.49\n    else:\n\
      \        forced_proba[i, :] = 0.49 / (len(classes) - 1)\n        forced_proba[i,\
      \ pred_index] = 0.51\n\nmetrics = {\n    \"accuracy\": float(accuracy_score(y_test,\
      \ y_pred)),\n    \"f1_score\": float(f1_score(y_test, y_pred, average=\"weighted\"\
      )),\n    \"precision\": float(precision_score(y_test, y_pred, average=\"weighted\"\
      , zero_division=0)),\n    \"recall\": float(recall_score(y_test, y_pred, average=\"\
      weighted\", zero_division=0)),\n    \"log_loss\": float(log_loss(y_test, forced_proba,\
      \ labels=classes))\n}\n\nprint(\"NLP metric-switch test model trained successfully\"\
      )\nfor key, value in metrics.items():\n    print(f\"{key}={value}\")\n\njoblib.dump(model,\
      \ \"model.joblib\")\n\nwith open(\"metrics.json\", \"w\", encoding=\"utf-8\"\
      ) as f:\n    json.dump(metrics, f, indent=2)\n\nsample = [\"le service est excellent\
      \ et rapide\"]\nprint(\"sample_prediction=\", model.predict(sample)[0])\n"
