custom_code:
  source_type: inline
  entrypoint: 36539f1a-4207-49f4-b38f-d585fa3f0732.py
  files:
    36539f1a-4207-49f4-b38f-d585fa3f0732.py: "import os\r\nimport argparse\r\nimport\
      \ cloudpickle\r\nimport numpy as np\r\nimport pandas as pd\r\n\r\n\r\nclass\
      \ GoldPriceLinearRegression:\r\n    \"\"\"\r\n    Modèle de régression linéaire\
      \ from scratch.\r\n    Il prédit le prix estimé de l'or en TND/gramme.\r\n \
      \   \"\"\"\r\n\r\n    def __init__(self, learning_rate=0.01, iterations=3000):\r\
      \n        self.learning_rate = learning_rate\r\n        self.iterations = iterations\r\
      \n        self.weights = None\r\n        self.bias = 0.0\r\n        self.feature_means\
      \ = None\r\n        self.feature_stds = None\r\n        self.feature_names =\
      \ None\r\n\r\n    def _standardize_fit(self, X):\r\n        self.feature_means\
      \ = X.mean(axis=0)\r\n        self.feature_stds = X.std(axis=0)\r\n\r\n    \
      \    self.feature_stds[self.feature_stds == 0] = 1\r\n\r\n        return (X\
      \ - self.feature_means) / self.feature_stds\r\n\r\n    def _standardize_predict(self,\
      \ X):\r\n        return (X - self.feature_means) / self.feature_stds\r\n\r\n\
      \    def fit(self, X, y):\r\n        X = np.array(X, dtype=float)\r\n      \
      \  y = np.array(y, dtype=float)\r\n\r\n        X_scaled = self._standardize_fit(X)\r\
      \n\r\n        n_samples, n_features = X_scaled.shape\r\n\r\n        self.weights\
      \ = np.zeros(n_features)\r\n        self.bias = 0.0\r\n\r\n        for _ in\
      \ range(self.iterations):\r\n            y_pred = np.dot(X_scaled, self.weights)\
      \ + self.bias\r\n\r\n            dw = (1 / n_samples) * np.dot(X_scaled.T, (y_pred\
      \ - y))\r\n            db = (1 / n_samples) * np.sum(y_pred - y)\r\n\r\n   \
      \         self.weights -= self.learning_rate * dw\r\n            self.bias -=\
      \ self.learning_rate * db\r\n\r\n    def predict(self, X):\r\n        if isinstance(X,\
      \ pd.DataFrame):\r\n            X = X[self.feature_names].values\r\n\r\n   \
      \     X = np.array(X, dtype=float)\r\n\r\n        if X.ndim == 1:\r\n      \
      \      X = X.reshape(1, -1)\r\n\r\n        X_scaled = self._standardize_predict(X)\r\
      \n\r\n        return np.dot(X_scaled, self.weights) + self.bias\r\n\r\n\r\n\
      def main():\r\n    parser = argparse.ArgumentParser()\r\n    parser.add_argument(\"\
      --data_path\", required=True, help=\"Chemin du dataset CSV\")\r\n    parser.add_argument(\"\
      --output_dir\", default=\"outputs\", help=\"Dossier de sortie\")\r\n    args\
      \ = parser.parse_args()\r\n\r\n    print(\"Starting gold price training...\"\
      )\r\n\r\n    df = pd.read_csv(args.data_path)\r\n\r\n    target_column = \"\
      gold_price_tnd_per_gram\"\r\n\r\n    feature_columns = [\r\n        \"gold_usd_per_ounce\"\
      ,\r\n        \"usd_tnd_rate\",\r\n        \"purity_karat\",\r\n        \"demand_index\"\
      \r\n    ]\r\n\r\n    X = df[feature_columns]\r\n    y = df[target_column]\r\n\
      \r\n    split_index = int(len(df) * 0.8)\r\n\r\n    X_train = X.iloc[:split_index]\r\
      \n    X_test = X.iloc[split_index:]\r\n\r\n    y_train = y.iloc[:split_index]\r\
      \n    y_test = y.iloc[split_index:]\r\n\r\n    model = GoldPriceLinearRegression(\r\
      \n        learning_rate=0.03,\r\n        iterations=5000\r\n    )\r\n\r\n  \
      \  model.feature_names = feature_columns\r\n    model.fit(X_train.values, y_train.values)\r\
      \n\r\n    predictions = model.predict(X_test)\r\n\r\n    rmse = np.sqrt(np.mean((y_test.values\
      \ - predictions) ** 2))\r\n    mae = np.mean(np.abs(y_test.values - predictions))\r\
      \n\r\n    print(f\"rmse={rmse}\")\r\n    print(f\"mae={mae}\")\r\n\r\n    example\
      \ = pd.DataFrame([\r\n        {\r\n            \"gold_usd_per_ounce\": 2050,\r\
      \n            \"usd_tnd_rate\": 3.12,\r\n            \"purity_karat\": 24,\r\
      \n            \"demand_index\": 1.05\r\n        }\r\n    ])\r\n\r\n    example_prediction\
      \ = model.predict(example)[0]\r\n\r\n    print(f\"prediction_example={example_prediction}\"\
      )\r\n\r\n    os.makedirs(args.output_dir, exist_ok=True)\r\n\r\n    model_path\
      \ = os.path.join(args.output_dir, \"model.pkl\")\r\n\r\n    with open(model_path,\
      \ \"wb\") as f:\r\n        cloudpickle.dump(model, f)\r\n\r\n    print(f\"Model\
      \ saved to {model_path}\")\r\n    print(\"Training completed successfully.\"\
      )\r\n\r\n\r\nif __name__ == \"__main__\":\r\n    main()"
