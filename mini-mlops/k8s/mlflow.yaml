apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-pvc
  namespace: mlops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: python:3.10-slim
          ports:
            - containerPort: 5000
          command: ["/bin/sh", "-c"]
          args: ["pip install mlflow && mkdir -p /data/mlflow/artifacts && mlflow server --backend-store-uri sqlite:////data/mlflow/mlflow.db --serve-artifacts --artifacts-destination /data/mlflow/artifacts --host 0.0.0.0 --port 5000 --allowed-hosts '*'"]
          volumeMounts:
            - name: mlflow-storage
              mountPath: /data/mlflow
      volumes:
        - name: mlflow-storage
          persistentVolumeClaim:
            claimName: mlflow-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: mlops
spec:
  selector:
    app: mlflow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP