apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-predict-api
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-predict-api
  template:
    metadata:
      labels:
        app: custom-predict-api
    spec:
      containers:
        - name: custom-predict-api
          image: acrmlopssalmav2.azurecr.io/mini-mlops:metrics-auto-final-v4
          imagePullPolicy: Always

          command:
            - uvicorn
          args:
            - src.deployment.custom_predict_api:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"

          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service.mlops.svc.cluster.local:5000"

            - name: DEFAULT_MODEL_NAME
              value: ""

            - name: DEFAULT_MODEL_ALIAS
              value: "production"

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: custom-predict-api-service
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: custom-predict-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP